<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="../css/nav.css" />
        <link rel="stylesheet" href="../css/home.css" />
        <link rel="stylesheet" href="../css/theme.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
        />

        <title>CV Studio</title>
    </head>

    <body>
        <!-- TOAST -->
        <div class="toast-area" id="toastArea"></div>

        <div class="home">
            <!-- SIDEBAR -->
            <div id="nav-container"></div>

            <!-- MAIN CONTENT -->
            <main class="main-content">
                <header class="home-header">
                    <div class="header-left">
                        <h2>
                            <span id="greeting">Chào buổi sáng</span>
                            <span id="user-name">...</span>
                        </h2>

                        <p>
                            <span id="current-date">...</span>
                            <span> · </span>
                            <span id="cv-count">0 CV</span>
                            <span> · </span>
                            <span id="interview-count"> 0 lịch phỏng vấn </span>
                        </p>
                    </div>

                    <!-- USER -->
                    <div class="header-user" id="header-user">
                        <div class="user-avatar" id="user-avatar">?</div>

                        <span id="user-short-name"> ... </span>

                        <i class="fa-solid fa-chevron-down"></i>

                        <!-- DROPDOWN -->
                        <div class="user-dropdown" id="user-dropdown">
                            <!-- MÀU CHỦ ĐẠO -->
                            <div class="dropdown-section">
                                <div class="dropdown-label">Màu chủ đạo</div>

                                <div class="color-options">
                                    <button
                                        class="color-option green active"
                                        data-color="#2f7867"
                                    ></button>

                                    <button
                                        class="color-option orange"
                                        data-color="#d18b32"
                                    ></button>

                                    <button
                                        class="color-option blue"
                                        data-color="#4c5f8f"
                                    ></button>

                                    <button
                                        class="color-option purple"
                                        data-color="#815273"
                                    ></button>

                                    <button
                                        class="color-option red"
                                        data-color="#bd4d3e"
                                    ></button>
                                </div>
                            </div>

                            <div class="dropdown-divider"></div>

                            <!-- CHẾ ĐỘ -->
                            <div class="dropdown-section">
                                <div class="dropdown-label">
                                    Chế độ hiển thị
                                </div>

                                <div class="theme-options">
                                    <button
                                        type="button"
                                        class="theme-option"
                                        data-theme="light"
                                    >
                                        <i class="fa-solid fa-sun"></i>
                                        Sáng
                                    </button>

                                    <button
                                        type="button"
                                        class="theme-option"
                                        data-theme="dark"
                                    >
                                        <i class="fa-regular fa-moon"></i>
                                        Tối
                                    </button>
                                </div>
                            </div>

                            <div class="dropdown-divider"></div>

                            <!-- ĐỔI MẬT KHẨU -->
                            <button
                                class="dropdown-item"
                                id="change-password-btn"
                            >
                                <i class="fa-solid fa-lock"></i>
                                <span>Đổi mật khẩu</span>
                            </button>

                            <!-- ĐĂNG XUẤT -->
                            <button
                                class="dropdown-item logout-item"
                                id="logout-btn"
                                onclick="logout()"
                            >
                                <i class="fa-solid fa-right-from-bracket"></i>

                                <span>Đăng xuất</span>
                            </button>
                        </div>
                    </div>
                </header>
                <!-- POPUP ĐỔI MẬT KHẨU -->
                <div class="password-modal" id="password-modal">
                    <div class="password-modal-content">
                        <!-- HEADER -->
                        <div class="password-modal-header">
                            <div>
                                <h2>Đổi mật khẩu</h2>
                                <p>
                                    Cập nhật mật khẩu mới cho tài khoản của bạn.
                                </p>
                            </div>

                            <button
                                type="button"
                                class="password-modal-close"
                                id="close-password-modal"
                            >
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <form id="change-password-form">
                            <!-- MẬT KHẨU HIỆN TẠI -->
                            <div class="field">
                                <label for="current-password">
                                    Mật khẩu hiện tại
                                </label>

                                <div class="input">
                                    <input
                                        id="current-password"
                                        type="password"
                                        placeholder="Nhập mật khẩu hiện tại"
                                        name="current_password"
                                    />

                                    <i class="fa-solid fa-lock"></i>

                                    <span
                                        class="eye"
                                        onclick="togglePassword(this)"
                                    >
                                        <i class="fa-regular fa-eye"></i>
                                    </span>
                                </div>
                            </div>

                            <!-- MẬT KHẨU MỚI -->
                            <div class="field">
                                <label for="new-password"> Mật khẩu mới </label>

                                <div class="input">
                                    <input
                                        id="new-password"
                                        type="password"
                                        placeholder="Ít nhất 8 kí tự"
                                        name="new_password"
                                        oninput="checkStrength(this.value)"
                                    />

                                    <i class="fa-solid fa-lock"></i>

                                    <span
                                        class="eye"
                                        onclick="togglePassword(this)"
                                    >
                                        <i class="fa-regular fa-eye"></i>
                                    </span>
                                </div>

                                <!-- ĐỘ MẠNH -->
                                <div class="strength-wrap" id="strength-bars">
                                    <div class="s-seg" id="s1"></div>
                                    <div class="s-seg" id="s2"></div>
                                    <div class="s-seg" id="s3"></div>
                                    <div class="s-seg" id="s4"></div>
                                </div>

                                <div
                                    class="strength-label"
                                    id="strength-text"
                                ></div>
                            </div>

                            <!-- XÁC NHẬN MẬT KHẨU -->
                            <div class="field">
                                <label for="confirm-password">
                                    Xác nhận mật khẩu
                                </label>

                                <div class="input">
                                    <input
                                        id="confirm-password"
                                        type="password"
                                        placeholder="••••••••"
                                        name="confirm_password"
                                    />

                                    <i class="fa-solid fa-lock"></i>

                                    <span
                                        class="eye"
                                        onclick="togglePassword(this)"
                                    >
                                        <i class="fa-regular fa-eye"></i>
                                    </span>
                                </div>
                            </div>

                            <!-- BUTTON -->
                            <div class="password-modal-actions">
                                <button
                                    type="button"
                                    class="cancel-password-btn"
                                    id="cancel-password"
                                >
                                    Hủy
                                </button>

                                <button
                                    type="submit"
                                    class="save-password-btn"
                                    onclick="handleChangePassword()"
                                >
                                    Đổi mật khẩu
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- CONTENT -->
                <section class="content">
                    <!-- TITLE -->
                    <div class="page-title">
                        <div>
                            <h1>CV của tôi</h1>

                            <p>
                                Quản lý, chỉnh sửa và tạo mới các bản CV của
                                bạn.
                            </p>
                        </div>

                        <button class="create-cv-btn" id="createCvBtn">
                            <i class="fa-solid fa-plus"></i>

                            Tạo CV mới
                        </button>
                    </div>

                    <!-- CV LIST -->
                    <div id="cv-container">
                        <!-- JS render ở đây -->
                    </div>
                </section>
            </main>
        </div>
    </body>
    <script src="../js/home.js"></script>
    <script src="../js/function.js"></script>
    <script src="../js/theme.js"></script>
</html>
