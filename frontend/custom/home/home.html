<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="../css/nav.css" />
        <link rel="stylesheet" href="../css/home.css" />
        <link rel="stylesheet" href="../css/theme.css" />
        <link rel="stylesheet" href="../css/header.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"

        <title>CV Studio</title>

    <body>
        <!-- TOAST -->
        <div class="toast-area" id="toastArea"></div>

        <div class="home">

            <div id="header-container"></div>

            <!-- MAIN CONTENT -->

                <!-- CONTENT -->
                <section class="content">
                    <!-- TITLE -->
                    <div class="page-title">
                        <div>
                            <h1>CV của tôi</h1>

                            <p>
                                Quản lý, chỉnh sửa và tạo mới các bản CV của

                        </div>

                        <button
                            class="create-cv-btn"
                            id="createCvBtn"
                            onclick="
                                window.location.href = '../cv/create_cv.html'
                            "
                        >
                            <i class="fa-solid fa-plus"></i>

                            Tạo CV mới
                        </button>
                    </div>

                    <!-- CV LIST -->
                    <div id="cv-container">
                        <!-- JS render ở đây -->
                    </div>
                </section>
            </main>
        </div>

    <script src="../js/home.js"></script>
